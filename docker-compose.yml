services:
  # ========================================================
  # 1. BASE DE DATOS: PostgreSQL 16
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: firmeza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: firmezadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmezadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # 2. BACKEND: ASP.NET Core 10 Web API
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmeza-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "postgres:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=firmezadb;Username=postgres;Password=12345
      - JwtSettings__SecretKey=FirmezaSuperSecretKeyParaTokensJWTConMasDe32Caracteres!
      - JwtSettings__Issuer=FirmezaApi
      - JwtSettings__Audience=FirmezaClients
      - JwtSettings__DurationInMinutes=60
    ports:
      - "5293:8080"

  # ========================================================
  # 3. FRONTEND: React + Vite + Nginx (Repositorio Vecino)
  # ========================================================
  frontend:
    build:
      context: ../Firmeza.Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5293/api
    container_name: firmeza-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
